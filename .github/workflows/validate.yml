name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate plugin JSON
        run: |
          jq . .claude-plugin/plugin.json > /dev/null
          jq . .claude-plugin/marketplace.json > /dev/null
          echo "✅ plugin.json / marketplace.json 為合法 JSON"

      - name: Check marketplace plugin entry has required fields
        run: |
          jq -e '.plugins[0] | .name and .version and .description and .source' \
            .claude-plugin/marketplace.json > /dev/null
          echo "✅ marketplace plugin 條目含 name/version/description/source"

      - name: Check version consistency (plugin / marketplace / CHANGELOG)
        run: |
          pv=$(jq -r '.version' .claude-plugin/plugin.json)
          mv=$(jq -r '.plugins[0].version' .claude-plugin/marketplace.json)
          cv=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ')
          echo "plugin.json=$pv  marketplace.json=$mv  CHANGELOG=$cv"
          test -n "$cv" || { echo "❌ CHANGELOG 找不到版本標題（格式應為 '## [x.y.z] - YYYY-MM-DD'）"; exit 1; }
          test "$pv" = "$mv" || { echo "❌ plugin.json($pv) 與 marketplace.json($mv) 版本不一致"; exit 1; }
          test "$pv" = "$cv" || { echo "❌ plugin.json($pv) 落後/超前 CHANGELOG 最新版($cv)——發版時三處要一起改"; exit 1; }
          echo "✅ 三處版本一致：$pv"

      - name: Check SKILL.md frontmatter
        run: |
          f="skills/slidev-deck-stack/SKILL.md"
          test -f "$f" || { echo "❌ 找不到 $f"; exit 1; }
          head -1 "$f" | grep -q '^---$' || { echo "❌ $f 缺 frontmatter 起始 ---"; exit 1; }
          grep -q '^name:' "$f"        || { echo "❌ $f frontmatter 缺 name:"; exit 1; }
          grep -q '^description:' "$f" || { echo "❌ $f frontmatter 缺 description:"; exit 1; }
          echo "✅ SKILL.md frontmatter 完整（name + description）"

      - name: Check all references exist
        run: |
          for r in handoff deck-planning setup slide-structure builtin-components code-and-diagrams animation theming-style export-delivery presenter-notes pitfalls; do
            test -f "skills/slidev-deck-stack/references/$r.md" || { echo "❌ 缺 references/$r.md"; exit 1; }
          done
          echo "✅ 11 份 references 齊全"

      - name: Check SKILL.md routes every reference
        run: |
          for r in skills/slidev-deck-stack/references/*.md; do
            b=$(basename "$r")
            grep -q "references/$b" skills/slidev-deck-stack/SKILL.md || { echo "❌ SKILL.md 路由表沒有 $b"; exit 1; }
          done
          echo "✅ SKILL.md 路由表涵蓋所有 references"

      - name: Run validate-deck.mjs against fixtures
        run: |
          v=skills/slidev-deck-stack/scripts/validate-deck.mjs
          node --check "$v"
          node "$v" tests/fixtures/good/slides.md --require-notes --strict
          if node "$v" tests/fixtures/bad/slides.md --target-minutes 20 > bad.log 2>&1; then
            echo "❌ bad fixture 應該失敗"; cat bad.log; exit 1
          fi
          for needle in '鐵則 #1' '鐵則 #2' '鐵則 #4' '鐵則 #7' '鐵則 #8' '<v-clicks>' 'routeAlias「dup」' 'deprecated' '連續 4 頁' '連續 5 頁密集頁'; do
            grep -q -- "$needle" bad.log || { echo "❌ bad fixture 沒有觸發：$needle"; cat bad.log; exit 1; }
          done
          if node "$v" tests/fixtures/budget/slides.md > budget.log 2>&1; then
            echo "❌ budget fixture 應該失敗"; cat budget.log; exit 1
          fi
          grep -q '90%' budget.log || { echo "❌ budget fixture 沒觸發 90% 時間預算檢查"; cat budget.log; exit 1; }
          echo "✅ validate-deck.mjs：good 通過、bad / budget 如預期失敗"
